# GitHub Dependabot configuration.
# Origin does not run Dependabot. This file applies only if the repository is
# connected to GitHub, or if a bot is later installed that reads it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # TypeScript 7 breaks typescript-eslint and Next; lift this once both support it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
