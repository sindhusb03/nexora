title = "Nexora gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Demo and CI-only credentials. They are not production secrets."
regexTarget = "match"
regexes = [
  '''nexora-demo-2026''',
  '''ci-only-auth-secret-0123456789abcdef0123456789''',
  '''ci-owner-password''',
  '''ci-api-password''',
  '''correct horse battery staple''',
  '''replace-with-at-least-32-characters''',
  '''8f0c0c4e-1b2a-4d5e-9c3a-0a1b2c3d4e5f''',
]
